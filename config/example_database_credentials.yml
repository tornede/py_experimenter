CREDENTIALS:
  Database:
    user: example_user
    password: example_password
  Connection:
    Standard: 
      server: example.mysqlserver.com
      use_ssl: some_boolean_value
      ssl_params:
        ca: config/certificates/ca.crt
        cert: config/certificates/user_cert.crt
        key: config/certificates/user_private_key.key