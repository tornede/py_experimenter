[project]
name = "py-experimenter"
version = "1.4.2"
description = "The PyExperimenter is a tool for the automatic execution of experiments, e.g. for machine learning (ML), capturing corresponding results in a unified manner in a database."
authors = [
    { name = "Tanja Tornede", email = "t.tornede@ai.uni-hannover.de" },
    { name = "Alexander Tornede", email = "a.tornede@ai.uni-hannover.de" },
    { name = "Lukas Fehring", email = "lukas.fehring@stud.uni-hannover.de" },
    { name = "Lukas Gehring" },
    { name = "Helena Graf", email = "h.graf@ai.uni-hannover.de" },
    { name = "Jonas Hanselle", email = "jonas.hanselle@upb.de" },
    { name = "Marcel Wever", email = "marcel.wever@ifi.lmu.de" },
    { name = "Felix Mohr", email = "felix.mohr@unisabana.edu.co" },
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.9"
keywords = ["python", "experiments", "database", "executor"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "numpy>=1.15",
    "pandas>=1.0",
    "jupyterlab>=3.5.0,<4",
    "joblib>=1.2.0,<2",
    "codecarbon>=2.2.1",
    "pymysql>=1.0.3,<2",
    "omegaconf>=2.3.0,<3",
    "setuptools>=69.5.1,<70",
]

[project.urls]
Documentation = "https://tornede.github.io/py_experimenter/"
Repository = "https://github.com/tornede/py_experimenter"

[dependency-groups]
dev = [
    "pytest>=7.0",
    "mock>=4.0",
    "sphinx>=5.0",
    "nbsphinx>=0.8.9,<0.9",
    "sphinx-gallery>=0.11.1,<0.12",
    "sphinx-autoapi>=2.0.0",
    "sphinx-rtd-theme>=1.0.0",
    "recommonmark>=0.7.1,<0.8",
    "freezegun>=1.2.2,<2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["py_experimenter"]

[tool.hatch.build.targets.sdist]
include = ["py_experimenter", "README.md", "LICENSE", "CHANGELOG.rst"]
